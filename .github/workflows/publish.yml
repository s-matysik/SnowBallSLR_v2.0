name: Publish to PyPI

# Trusted Publishing (OIDC): no API token is stored anywhere. PyPI must have a
# trusted publisher registered for this repository, this workflow file and the
# environment "pypi" (see RELEASING.md).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('snowballslr/_version.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package v$v"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel without its CLI dependency (browser runtime check)
        run: |
          python -m venv /tmp/nodeps
          /tmp/nodeps/bin/pip install --no-deps dist/*.whl
          /tmp/nodeps/bin/pip install httpx pydantic numpy scipy networkx pyyaml
          cd /tmp && /tmp/nodeps/bin/python -c "import snowballslr, sys; assert 'typer' not in sys.modules; print(snowballslr.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
